name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:

  lint:
    name: Lint & Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - uses: codecov/codecov-action@v4
        with: { token: ${{ secrets.CODECOV_TOKEN }} }
        if: always()

  build:
    name: Vite build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (with placeholder env vars)
        run: pnpm build
        env:
          VITE_API_URL:     http://placeholder.local
          VITE_WS_URL:      ws://placeholder.local
          VITE_APP_NAME:    EventCraft
          VITE_ENVIRONMENT: production
      - name: Verify dist output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)

  docker-build:
    name: Docker build verify
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    ./Dockerfile
          push:    false
          build-args: |
            VITE_API_URL=http://placeholder.local
            VITE_WS_URL=ws://placeholder.local
            VITE_ENVIRONMENT=production
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: eventcraft-web:ci
