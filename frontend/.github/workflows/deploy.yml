name: Deploy

on:
  push:
    branches: [main]

jobs:

  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            # ── OPTION A: GHCR (active now, no AWS needed) ──────────
            ghcr.io/${{ github.repository_owner }}/eventcraft-web
            # ── OPTION B: AWS ECR (uncomment when AWS ready) ─────────
            # ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/eventcraft-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # ── OPTION A: GHCR ───────────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── OPTION B: AWS ECR (uncomment when AWS ready) ─────────────
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      # - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    ./Dockerfile
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
            VITE_ENVIRONMENT=production
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Deploy (TODO — wire up target)
        # ── Railway option ────────────────────────────────────────────
        # run: |
        #   curl -X POST https://backboard.railway.app/graphql/v2 \
        #     -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
        #     ...
        run: echo "TODO — wire up deploy target"

      # ── AWS ECS option (uncomment when ready) ─────────────────────
