name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  all-checks:
    name: Lint + Type + Test + Build + Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      - name: Vite build
        run: pnpm build
        env:
          VITE_API_URL:     http://placeholder.local
          VITE_WS_URL:      ws://placeholder.local
          VITE_ENVIRONMENT: production
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file:    ./Dockerfile
          push:    false
          build-args: |
            VITE_API_URL=http://placeholder.local
            VITE_WS_URL=ws://placeholder.local
            VITE_ENVIRONMENT=production
